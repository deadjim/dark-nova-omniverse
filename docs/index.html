<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>Dark Nova: Omniverse — V0</title>
  <script type="module" crossorigin src="./assets/index-DnP5qHmP.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bl4YShdV.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="dn-mark" aria-hidden="true">DN</div>
        <div>
          <h1>Dark Nova: Omniverse</h1>
          <div class="tag">DN · Loop 2 · V0</div>
        </div>
      </div>
      <div class="hud" aria-live="polite">
        <div><span class="cred">creds</span> <strong id="creds">0</strong></div>
        <div><span class="energy">energy</span> <strong id="energy">100</strong>/<span id="energyCap">100</span></div>
        <div>Lv <strong id="level">1</strong> · <span id="tickLabel">regen 60s</span></div>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="DN sections">
      <button type="button" class="tab" role="tab" id="tab-missions" aria-selected="false" aria-controls="panel-missions" data-tab="missions">Missions</button>
      <button type="button" class="tab" role="tab" id="tab-systems" aria-selected="true" aria-controls="panel-systems" data-tab="systems">Systems</button>
      <button type="button" class="tab" role="tab" id="tab-stations" aria-selected="false" aria-controls="panel-stations" data-tab="stations">Stations</button>
    </nav>

    <section id="panel-missions" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-missions">
      <div class="panel cyan">
        <div class="row" style="margin-bottom:8px">
          <strong>Ship skills</strong>
          <span class="tag" id="pointsLabel">0 pts</span>
        </div>
        <div id="skills"></div>
        <p class="hint">+10 energy every 60s. Loss stays in the combat log — no Refit.</p>
      </div>
      <div id="missions"></div>
      <div class="panel">
        <strong>Combat log</strong>
        <div class="log" id="log"></div>
      </div>
    </section>

    <section id="panel-systems" class="tab-panel" role="tabpanel" aria-labelledby="tab-systems">
      <div id="systemsRoot"></div>
    </section>

    <section id="panel-stations" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-stations">
      <div id="stationsRoot"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
